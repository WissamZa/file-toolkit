[project]
name = "file-toolkit"
version = "0.1.0"
description = "Menu-driven CLI for organizing photo/PDF folders: index, compile to PDF, hard-link, and export."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "reportlab>=4.0",
    "pypdf>=4.0",
    "pillow>=11.3.0",
    "imagehash>=4.3.2",
    "numpy>=2.0.2",
    "pymupdf>=1.26.5",
    "piexif>=1.1.3",
]

[project.scripts]
file-toolkit = "file_toolkit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["file_toolkit.py", "image_tools.py", "image_gui.py", "quick_renamer.py", "renamer_web.py"]
