; ================== File Toolkit configuration ==================
; A file_toolkit.conf in the directory you launch the app from
; overrides this one. Any key you delete falls back to its default.

[settings]
; The folder the toolkit operates on: where day folders are created,
; files are indexed and sorted into month folders, and PDFs are built.
; Use an absolute path (e.g. /home/barg/Documents/scans) to always work
; on the same folder no matter where you launch the app from, or leave
; "." to work in whatever directory you start the app in.
folder = .

; Where files.db, exported files, compiled PDF hard-links and the image
; features' output folders live. Relative values are resolved inside `folder`.
database = files.db
export_output = export_output
pdf_dir = pdf
similar_review = similar_review
cropped_output = auto_cropped
